version: 1
name: MoveIDE
run:
  url: https://moveide-demo.example
testCases:
  - id: measure-squat
    name: One-button squat review and durable local history
    steps:
      - Open MoveIDE; it starts on the homepage. Save on this device stays on by default. This public QA preview has no ChatGPT account; do not log in.
      - Choose Try a sample squat once and wait up to two minutes for Heavy analysis.
      - Review both complete reps. Select Bottom and inspect the source moment, skeleton and angles. Play and pause; inspect the live-updating chart, units and readable labels. Change the personal reference/compare rep and confirm the differences are understandable and not a good/bad score.
      - Open History, rename the saved sample QA squat review, and open it without starting another analysis.
      - Reload, return to History if needed, reopen QA squat review and download its video and session data.
      - Report confusing wording, layout jumps, unusable controls and misleading AI status.
    criteria: One sample action produces two measured reps with playable video and pose overlay. Evidence seeks the matching moment. The renamed saved session survives reload, reopens with its video and measurements, and has usable video/data downloads. Disconnected AI is honestly explained without blocking local analysis or inventing coaching. No manual packet or send task is required.
  - id: compare-and-handoff
    name: Compare two independent recordings without a manual handoff
    steps:
      - Open MoveIDE and choose Compare examples. ChatGPT is deliberately disconnected in this preview.
      - Wait up to three minutes for both example recordings to finish analysis.
      - Inspect both videos and separately labeled measurements. Select a rep for each recording and use the shared start, bottom and stand phase controls.
      - Play and pause each video; check independent source times and missing measurements are not zero or bad posture.
      - Return to recorded review and verify its sample action remains accessible. Report confusing labels, unreadable comparison or clipping.
    criteria: Two genuinely different videos are playable with independent source-timed overlays, rep selection and phase navigation. Comparison shows like-for-like knee bend, torso lean and duration with limits. The examples are labeled Good example and Bad example and the page says those labels come from the source dataset, not from MoveIDE; no clinical or diagnostic claim is made. No ChatGPT account or manual coaching packet is required.
  - id: live-setup-and-navigation
    name: Live setup comprehension and navigation without a camera
    steps:
      - Navigate to Live coaching. Inspect source selection, Start coached squat, the local saving choice and coaching area before starting.
      - Read capture guidance, saving explanation and queued-coach explanation. Inspect the movement chart, practice-target wording and expandable Session diagnostics with its download button. Do not grant a camera or create a phone pairing in this static preview; physical device and queued-response execution tests are separate.
      - Inspect keyboard focus, readable labels and unobstructed controls. If resizing is available, inspect a narrow viewport for page overflow.
      - Follow History from live, check its local-browser explanation and empty or populated state, then return to recorded review.
      - Review each visible section for consistency with recorded review and History. Report concrete improvements with reproduction steps, including unclear queue/Stop semantics, misleading ready or AI claims, empty graph labels, contrast, clipping, spacing, disappearing guidance or inaccessible navigation.
    criteria: Live setup distinguishes camera selection, starting, optional AI and local recording. It shows no fabricated measurements or coaching before capture. History is reachable and has a clear state and return path. Controls and guidance are usable; graph/diagnostics explain their empty state. Stop versus queued AI is understandable, and earlier notes are not claimed before capture. Device-only behavior is explicitly untested.
