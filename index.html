<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoveIDE</title>
    <style>
      /* Shares the Live camera page's palette and shapes (harness/live/app.css). */
      :root {
        color-scheme: light;
        --bg: #f4f6f0; --fg: #162d27; --ink: #193e30; --ink-fg: #f3ffe9;
        --soft: #e1e8dd; --panel: #fafbf7; --line: #dbe3d6; --line-strong: #ccd8cc;
        --muted: #63766a; --fine: #73816f; --stage: #101e19; --chip: #152820db;
        --focus: #58ac76; --error: #964b2f; --warning: #8a570b;
        --knee: #2563eb; --torso: #c2410c;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px; line-height: 1.5; color: var(--fg); background: var(--bg); font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); }
      main { max-width: 1440px; margin: auto; padding: 30px 48px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 42px; }
      .wordmark { display: inline-flex; align-items: center; min-height: 44px; font-size: 20px; font-weight: 800; letter-spacing: -1px; color: inherit; text-decoration: none; }
      .wordmark span { font-weight: 400; }
      .source-nav { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line-strong); border-radius: 40px; }
      .source-nav a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 40px; font-size: 13px; color: #4e6355; text-decoration: none; }
      .source-nav a[aria-current="page"] { background: var(--ink); color: var(--ink-fg); font-weight: 600; }
      @media (hover: hover) and (pointer: fine) { .source-nav a:not([aria-current]):hover { color: var(--fg); background: var(--soft); } }
      .eyebrow { font-size: 10px; letter-spacing: 1.6px; font-weight: 700; color: var(--muted); margin: 0; }
      .intro { display: flex; justify-content: space-between; gap: 30px; align-items: center; margin-bottom: 26px; }
      h1 { font-size: clamp(32px, 4.2vw, 57px); font-weight: 500; letter-spacing: -2.5px; margin: 10px 0 12px; line-height: 1.06; }
      h2 { font-size: 15px; font-weight: 500; margin: 20px 0 8px; }
      h2:first-child { margin-top: 0; }
      p { margin: 8px 0; }
      a { color: inherit; }
      .subhead { color: #617367; max-width: 530px; font-size: 15px; line-height: 1.6; margin-bottom: 0; }
      .actions { display: flex; flex-direction: column; gap: 10px; max-width: 460px; }
      .start-disclosure { font-size: 11px; line-height: 1.5; color: var(--muted); margin: 0; }
      .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .model-select { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
      button, .button {
        font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--soft); border: 0;
        border-radius: 40px; padding: 10px 18px; min-height: 40px; cursor: pointer; white-space: nowrap;
        transition: background-color 150ms ease;
      }
      select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid #c8d5c3; border-radius: 12px; padding: 8px 10px; min-height: 40px; }
      button:hover:not(:disabled), .button:hover { background: #d3dccd; }
      button:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }
      button.primary { background: var(--ink); color: var(--ink-fg); padding: 14px 25px; font-size: 14px; }
      button.primary:hover:not(:disabled) { background: #245541; }
      button:focus-visible, select:focus-visible, .button:focus-within, summary:focus-visible, svg:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      .button { display: inline-flex; align-items: center; position: relative; }
      .button input { position: absolute; opacity: 0; width: 1px; }
      progress { vertical-align: middle; accent-color: var(--ink); }
      .workbench { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
      .workbench:has(> aside) { grid-template-columns: minmax(0, 1fr) 340px; }
      .stage { position: relative; background: var(--stage); height: 70vh; min-height: 320px; border-radius: 24px; overflow: hidden; color: #f3f9f3; }
      .stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .stage .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; padding: 30px; text-align: center; font-size: 22px; color: #9fb0a4; }
      .cue { position: absolute; pointer-events: none; bottom: 56px; left: 22px; right: 22px; padding: 10px 16px; border-radius: 18px; color: #e0eadd; background: var(--chip); }
      .cue p { margin: 4px 0; }
      .coaching-feed { display: grid; gap: 10px; list-style: none; padding: 0; margin: 14px 0 0; }
      .coaching-card { padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); }
      .coaching-stamp { font-size: 11px; color: var(--muted); }
      .coaching-focus { font-weight: 600; font-size: 15px; line-height: 1.5; }
      .coaching-card details { margin-bottom: 0; }
      .coaching-card details p { max-width: 72ch; }
      aside, section.readout, .compare { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 21px; }
      aside { font-size: 13px; }
      aside > .toolbar { margin: 10px 0; }
      section.readout, .compare { margin-top: 18px; }
      .compare { overflow-x: auto; }
      p.readout { background: #e7ece4; border-radius: 14px; padding: 12px 14px; }
      aside ul { list-style: none; padding: 0; margin: 0; }
      aside li button { width: 100%; text-align: left; margin-bottom: 4px; font-weight: 500; border-radius: 14px; }
      button[aria-pressed='true'] { background: var(--ink); color: var(--ink-fg); }
      .compare table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; }
      .compare th, .compare td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); }
      .compare th { font-weight: 600; color: var(--muted); }
      details { margin: 12px 0; } summary { cursor: pointer; font-size: 12px; font-weight: 600; color: #345b3e; }
      .packet { background: #e7ece4; border-radius: 15px; padding: 16px; margin-top: 12px; }
      .packet pre { white-space: pre-wrap; font-size: 12px; max-height: 300px; overflow: auto; }
      .frames { display: flex; gap: 8px; flex-wrap: wrap; }
      .frames figure { margin: 0; width: 180px; }
      .thumb { width: 180px; aspect-ratio: 9 / 16; object-fit: contain; background: var(--stage); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; }
      .muted { color: var(--muted); }
      .fine { font-size: 11px; line-height: 1.6; color: var(--fine); margin: 0; }
      .fine:empty { display: none; }
      .error { color: var(--error); }
      .thumb.error { color: #fca5a5; }
      .warning { color: var(--warning); }
      .trace { margin: 12px 0; } .trace svg { width: 100%; height: auto; cursor: crosshair; background: #eef2ea; border-radius: 10px; }
      .trace figcaption { font-size: 11px; color: var(--muted); }
      .trace path { fill: none; stroke-width: 1.5; } .trace .rep { fill: #dfe7d9; }
      .trace .bottom { stroke: #8a9a8c; stroke-dasharray: 2 2; } .trace .playhead { stroke: var(--fg); }
      path.knee { stroke: var(--knee); } path.torso { stroke: var(--torso); } span.knee { color: var(--knee); } span.torso { color: var(--torso); }
      .phases { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 0 0 6px; font-weight: 600; font-size: 12px; }
      .phases button { font-size: 12px; font-weight: 500; padding: 6px 10px; min-height: 32px; }
      footer { margin-top: 24px; padding: 12px 4px; border-top: 1px solid #dce4d6; font-size: 10px; color: #7b8878; }
      footer a { color: #45613d; }
      @media (max-width: 1000px) { main { padding: 24px; } .workbench:has(> aside) { grid-template-columns: minmax(0, 1fr) 300px; } .intro { align-items: end; } }
      @media (max-width: 730px) {
        main { padding: 20px 16px; } header { padding-bottom: 30px; } h1 { letter-spacing: -1.5px; }
        .intro { display: block; } .actions { margin-top: 22px; max-width: none; }
        .workbench:has(> aside) { grid-template-columns: minmax(0, 1fr); }
        .stage { height: auto; aspect-ratio: 3 / 4; } aside { padding: 16px; }
        select { font-size: 16px; } .source-nav a { min-height: 44px; } button, .button { min-height: 44px; }
      }
      .recordings-comparison { margin-top: 24px; }
      .recording-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin: 18px 0; }
      .recording-card { min-width: 0; border: 1px solid var(--line); border-radius: 18px; padding: 14px; background: var(--panel); }
      .recording-card h3 { font-size: 14px; font-weight: 600; margin: 0; }
      .recording-card .toolbar { justify-content: space-between; margin-bottom: 12px; }
      .recording-card label { font-size: 12px; color: var(--muted); }
      .recording-stage { height: 420px; min-height: 0; }
      .recordings-comparison table { width: 100%; font-size: 13px; }
      .recordings-comparison th { text-align: left; }
      .recordings-comparison td, .recordings-comparison th { padding: 10px 6px; border-bottom: 1px solid var(--line); }
      .recordings-comparison details { margin-top: 16px; overflow-wrap: anywhere; }
      .recordings-comparison summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
      @media (max-width: 650px) {
        .recording-pair { grid-template-columns: 1fr; }
        .recording-stage { height: 380px; }
        .recordings-comparison table { font-size: 11px; }
        .recordings-comparison td, .recordings-comparison th { padding: 8px 3px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
