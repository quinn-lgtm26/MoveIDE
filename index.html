<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoveIDE</title>
    <style>
      :root {
        color-scheme: light;
        --background: oklch(1 0 0); --foreground: oklch(0.1788 0.0047 264.45);
        --card: oklch(0.9542 0 0); --primary: oklch(0.2244 0.0039 264.49); --primary-foreground: oklch(1 0 0);
        --secondary: oklch(0.9619 0 0); --muted: oklch(0.9696 0 0); --muted-foreground: oklch(0.5 0 0);
        --destructive: oklch(0.55 0.2082 25.38); --warning: oklch(0.52 0.13 60); --border: oklch(0.9234 0 0); --ring: var(--primary);
        --radius: 0.875rem; --radius-sm: calc(var(--radius) - 0.25rem); --radius-xl: calc(var(--radius) + 0.25rem);
        --shadow-sm: 0 0.0625rem 0.1875rem 0 rgba(0,0,0,0.07), 0 0.0625rem 0.125rem -0.0625rem rgba(0,0,0,0.05);
        --shadow-primary: 0 0.0625rem 0.1875rem rgba(0,0,0,0.2), 0 0.125rem 0.5rem rgba(0,0,0,0.1), inset 0 0.0625rem 0 rgba(255,255,255,0.08);
        --ease: cubic-bezier(0.165, 0.84, 0.44, 1);
        --knee: #2563eb; --torso: #c2410c;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px; line-height: 1.5;
      }
      body { margin: 0; background: var(--background); color: var(--foreground); }
      main { max-width: 75rem; margin: 0 auto; padding: 1.5rem; }
      h1 { font-size: 1.375rem; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 1.5rem; }
      h2 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.375rem; }
      h2:first-child { margin-top: 0; }
      p { margin: 0.5rem 0; }
      a { color: inherit; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
      header h1 { margin: 0; }
      .source-nav { display: flex; gap: 0.25rem; padding: 0.25rem; background: var(--muted); border-radius: var(--radius-xl); }
      .source-nav a { text-decoration: none; padding: 0.375rem 0.875rem; min-height: 2.25rem; box-sizing: border-box; display: inline-flex; align-items: center; border-radius: var(--radius); color: var(--muted-foreground); }
      .source-nav a[aria-current="page"] { background: var(--background); color: var(--foreground); font-weight: 550; box-shadow: var(--shadow-sm); }
      @media (hover: hover) and (pointer: fine) { .source-nav a:not([aria-current]):hover { color: var(--foreground); } }
      .source-nav a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.75rem; }
      button, select, .button {
        font: inherit; color: var(--foreground); background: var(--secondary); border: 1px solid var(--border);
        border-radius: var(--radius-xl); padding: 0.4375rem 0.875rem; min-height: 2.25rem; cursor: pointer;
        transition: background-color 150ms var(--ease), box-shadow 150ms var(--ease);
      }
      select { padding-right: 0.5rem; }
      button:hover:not(:disabled), .button:hover { background: var(--border); }
      button:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
      button.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); box-shadow: var(--shadow-primary); font-weight: 550; }
      button.primary:hover:not(:disabled) { background: oklch(0.32 0.004 264.5); }
      button:focus-visible, select:focus-visible, .button:focus-within, summary:focus-visible, svg:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      .button { display: inline-flex; align-items: center; position: relative; }
      .button input { position: absolute; opacity: 0; width: 1px; }
      progress { vertical-align: middle; accent-color: var(--primary); }
      .workbench { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; margin-top: 1rem; align-items: start; }
      .workbench:has(> aside) { grid-template-columns: minmax(0, 1fr) 22rem; }
      @media (max-width: 800px) { .workbench:has(> aside) { grid-template-columns: minmax(0, 1fr); } main { padding: 1rem; } select { font-size: 16px; } }
      .stage { position: relative; background: #000; height: 70vh; min-height: 320px; border-radius: 1rem; overflow: hidden; }
      .stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .stage .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; padding: 1.5rem; text-align: center; color: oklch(0.8 0 0); }
      .cue { position: absolute; pointer-events: none; bottom: 3.25rem; left: 0.75rem; right: 0.75rem; padding: 0.625rem 0.875rem; border-radius: var(--radius); color: #fff; background: rgba(15,23,42,.88); }
      .cue p { margin: 0.3rem 0; }
      .coaching-feed { display: grid; gap: 0.75rem; list-style: none; padding: 0; margin: 1rem 0 0; }
      .coaching-card { padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--muted); }
      .coaching-stamp { font-size: 12px; color: var(--muted-foreground); }
      .coaching-focus { font-weight: 550; font-size: 1rem; line-height: 1.5; }
      .coaching-card details { margin-bottom: 0; }
      .coaching-card details p { max-width: 72ch; }
      aside, section.readout, .compare { background: var(--background); border: 1px solid var(--border); border-radius: 1rem; padding: 1.25rem; box-shadow: var(--shadow-sm); }
      section.readout, .compare { margin-top: 1rem; }
      aside ul { list-style: none; padding: 0; margin: 0; }
      aside li button { width: 100%; text-align: left; margin-bottom: 0.25rem; }
      button[aria-pressed='true'] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
      .compare table { border-collapse: collapse; margin: 0.5rem 0; width: 100%; }
      .compare th, .compare td { text-align: left; padding: 0.375rem 0.75rem 0.375rem 0; border-bottom: 1px solid var(--border); }
      .compare th { font-weight: 550; color: var(--muted-foreground); }
      details { margin: 0.75rem 0; } summary { cursor: pointer; font-weight: 550; }
      .packet { background: var(--muted); border-radius: var(--radius); padding: 1rem; margin-top: 0.75rem; }
      .packet pre { white-space: pre-wrap; font-size: 12px; max-height: 300px; overflow: auto; }
      .frames { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .frames figure { margin: 0; width: 180px; }
      .thumb { width: 180px; aspect-ratio: 9 / 16; object-fit: contain; background: #000; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; }
      .muted { color: var(--muted-foreground); }
      .error { color: var(--destructive); }
      .thumb.error { color: #fca5a5; }
      .warning { color: var(--warning); }
      .trace { margin: 0.75rem 0; } .trace svg { width: 100%; height: auto; cursor: crosshair; background: var(--muted); border-radius: var(--radius-sm); }
      .trace figcaption { font-size: 13px; color: var(--muted-foreground); }
      .trace path { fill: none; stroke-width: 1.5; } .trace .rep { fill: oklch(0.9 0 0); }
      .trace .bottom { stroke: #888; stroke-dasharray: 2 2; } .trace .playhead { stroke: var(--foreground); }
      path.knee { stroke: var(--knee); } path.torso { stroke: var(--torso); } span.knee { color: var(--knee); } span.torso { color: var(--torso); }
      .phases { display: flex; flex-wrap: wrap; gap: 0.25rem; align-items: center; margin: 0 0 0.5rem; font-weight: 550; }
      .phases button { font-size: 13px; font-weight: 400; padding: 0.25rem 0.625rem; min-height: 2rem; white-space: nowrap; }
      footer { margin-top: 2rem; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
