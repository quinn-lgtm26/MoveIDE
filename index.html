<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoveIDE</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; }
      main { max-width: 1200px; margin: 0 auto; padding: 16px; }
      header { display: flex; align-items: baseline; justify-content: space-between; }
      .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
      .button { border: 1px solid; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      .button:focus-within { outline: 2px solid Highlight; }
      .button input { position: absolute; opacity: 0; width: 1px; }
      .workbench { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
      @media (max-width: 800px) { .workbench { grid-template-columns: 1fr; } }
      .stage { position: relative; background: #000; height: 70vh; min-height: 320px; }
      .stage video { width: 100%; height: 100%; object-fit: contain; display: block; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      aside ul { list-style: none; padding: 0; }
      aside button { width: 100%; text-align: left; padding: 6px 8px; margin-bottom: 4px; }
      aside button[aria-pressed='true'] { outline: 2px solid #facc15; }
      .compare table { border-collapse: collapse; margin: 8px 0; }
      .compare th, .compare td { text-align: left; padding: 4px 10px 4px 0; }
      .compare td button[aria-pressed='true'] { outline: 2px solid #facc15; }
      .packet { border: 1px solid #8884; border-radius: 6px; padding: 12px; }
      .packet pre { white-space: pre-wrap; font-size: 12px; max-height: 300px; overflow: auto; }
      .frames { display: flex; gap: 8px; flex-wrap: wrap; }
      .frames figure { margin: 0; width: 180px; }
      .thumb { width: 180px; aspect-ratio: 9 / 16; object-fit: contain; background: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; }
      .muted { opacity: 0.65; }
      .error { color: #ef4444; }
      .warning { color: #f59e0b; }
      .trace { margin: 8px 0; } .trace svg { width: 100%; height: auto; cursor: crosshair; background: #8881; }
      .trace path { fill: none; stroke-width: 1.5; } .trace .rep { fill: #8882; }
      .trace .bottom { stroke: #888; stroke-dasharray: 2 2; } .trace .playhead { stroke: currentColor; }
      path.knee { stroke: #3b82f6; } path.torso { stroke: #f59e0b; } span.knee { color: #3b82f6; } span.torso { color: #f59e0b; }
      .phases { display: inline-flex; gap: 4px; align-items: center; margin-right: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
