)"},accent:{primary:"var(--accent)"}}}var E=bl(hn()),A="https://github.com/quinn-lgtm26/MoveIDE/blob/main",Gv=["Workflow","Story status","System","Verification","Squat methodology","Frontend handoff"],Bf=[{id:"01",title:"One Start, one coached session",owner:"Shared \xB7 contracts established",work:"Start coordinates local Heavy tracking, timestamped measurements, exact source JPEGs, coaching principles and asynchronous interpretation. Evidence packets remain internal, with optional developer exports. The session amendment replaces the old manual preview/send workflow.",proof:"One Start passed real ChatGPT on smoke and root. Root made one request with six measurements and source images at 1,067/3,000 ms; both rep cues resolved and seeking made no extra request. This is bounded evidence, not full-video interpretation."},{id:"02",title:"Build and verify the first real angle",owner:"Motion \xB7 verified / Product integration \xB7 frontend owner",work:"MediaPipe Heavy v1 is now the user-selected default. A local browser worker records decoded presentation timestamps and computes same-side projected angles. Full remains an explicit tested alternative. Both asset hashes are checked during setup and inference.",proof:"Heavy passed the seven-fixture workflow. The clear sample tracks 57/57 frames with two bottoms at 1,067 and 3,000 ms. Optional onPoseFrame capture preserves 33 normalized xyz and world xyz slots per sample, with nullable confidence. Built smoke verified its local export."},{id:"03",title:"Review two reps and source evidence",owner:"Shared harness integrated in PR #13",work:"Local phase traces, projected metrics and source evidence support review. Start dispatches bounded coaching automatically; packet/copy controls are developer-only. Timestamped concise cards stack in smoke/live and retain accepted history.",proof:"Production c1c9378 passed20 fresh-build readiness checks,15 controlled-provider lifecycle checks and7 real-provider checks. Retained short cards, Why, Stop/reset and source races pass. Latest9446951 restyle also passes15 production checks and the user-visible real Heavy/GPT demo shows two short retained cards. Two distinct Heavy video sources pass21 local browser checks, including independent clocks/hashes and retrying B without reanalyzing A."},{id:"04",title:"Verify ChatGPT sign-in and evidence interpretation",owner:"Real root and public phone-path AI verified",work:"Public HTTPS phone delivery, real WebRTC, Heavy and real ChatGPT feedback return passed across two Chrome contexts using a fixture-backed camera. One request carried three phase JPEGs; the10.209-second response appeared as historical coaching after adaptive resize.",proof:"qa/phone-https.json records returned AI, local captions and Stop cleanup. This is browser-based phone-path evidence, not a physical iPhone test or network latency guarantee."},{id:"05",title:"Integrate and verify the final build",owner:"Polished demo \xB7 final Wren3/3 passed",work:"Two-source comparison and final Wren are complete for the scoped demo. Remaining implementation includes OpenCap import UI, evidence-bound region accents, selectable goals/references and automatic view/calibration work. Physical iPhone, broad accessibility and independent motion accuracy require separate acceptance.",proof:"110 harness and8 launcher/doctor tests pass (118 total). Fresh efe97bd setup/build and pinned asset hashes pass. Current root preview passes15 controlled-provider checks; history passes22 journeys and6 lifecycle cases. First product Wren passed3/3 on2ad37f8. Polished f4a987a rerun passed3/3; physical iPhone and independent accuracy remain."},{id:"06",title:"Keep recordings and review past sessions",owner:"Polished replay \xB7 browser-verified",work:"User chose local-only storage. Recorded originals, immutable reports and accepted coaching persist in IndexedDB. Live Stop saves a bounded recording, metrics, notes and exact evidence JPEGs. History supports search, rename, replay, downloads and explicit deletion. Stop retains video, full accepted notes and historical measurements until New Start; source selection alone keeps the review. Opt-out permits bounded temporary replay only.",proof:"Post-merge local checks pass22 root/history journeys,6 lifecycle/recovery cases and10 storage groups, with real Chrome recording playback and failure downloads. Evidence covers efe97bd plus recorded worktree changes; no physical iPhone or cloud-sync claim."}],Rm=[{title:"Stopped-session and history review",stack:"Native video playback \xB7 retained coaching \xB7 historical measurement inspector",body:"Stop clears live geometry and camera resources, then keeps the bounded recording and accepted notes until New Start. History offers video beside notes, slow playback and disclosed approximate timing. Reduced motion is honored. Chat remains on hold; the biomechanics identity does not expand supported movement claims."},{title:"Browser workbench",stack:"React \xB7 TypeScript \xB7 Vite \xB7 Canvas 2D",body:"One Start coordinates analysis and coaching. Root, smoke and live retain concise timestamped cards with expandable reasons. Root passes15 controlled-provider production-preview checks. Preserve the shared controller, source resets and root/live navigation during design work."},{title:"Local measurement engine",stack:"Browser worker \xB7 MediaPipe Tasks Vision 1.2.2 \xB7 WASM \xB7 Heavy v1",body:"Heavy is the default and Full remains selectable. Setup stages both pinned assets with SHA-256 verification. The 15 Hz sampler records actual decoded timestamps. The standard report carries 33 x/y/visibility slots; optional onPoseFrame capture preserves normalized xyz and estimated world xyz with nullable visibility/presence. Keep coordinate definitions and model provenance attached."},{title:"Report, evidence and replay",stack:"AnalysisReport v1 \xB7 local raw-pose trace \xB7 CoachPacket v1 \xB7 JPEG",body:"The report and extended profile describe projected squat measurements and phases. Raw model depth is an estimate. The bounded coaching packet includes only selected metrics, context and approved source images. Validated response IDs drive timestamped playback cues without requesting the model again on every frame."},{title:"Optional provider",stack:"Node loopback \xB7 OAuth with PKCE \xB7 Responses \xB7 validated output",body:"Credentials remain in the loopback service. Disclosed Start authorizes selected source JPEGs and bounded measurements automatically. Playback never triggers new inference; Live Stop drains bounded queued reviews; new Start cancels unfinished work. Live requests are evidence-bound. No full-video upload is claimed."},{title:"Optional OpenCap research import",stack:"Text .mot parser \xB7 scaled-model/video hashes \xB7 explicit source-row mapping",body:"The importer accepts separately produced OpenSim kinematics and labels them imported-unverified. It preserves source frame indices, coordinate units and model signs. It does not execute OpenCap or turn MediaPipe depth into OpenSim kinematics. Native execution is unavailable on this Darwin arm64 machine without a compatible NVIDIA runtime, approved assets and calibrated capture metadata."},{title:"Live squat capture",stack:"MediaStream \xB7 Heavy worker \xB7 bounded history \xB7 optional WebRTC",body:"One pose frame in flight and no backlog; exact accepted pixels supply live JPEGs. Phone video enters the same Heavy controller; local/AI feedback returns by data channel. Dedicated HTTPS signaling uses phone long polling, while provider credentials stay local. Physical device and physical venue acceptance remains."},{title:"Experimental view and 3D diagnostics",stack:"createViewGuard \xB7 analyzeMultiViewFrame \xB7 explicit reason/epoch/provenance",body:"Integrated live samples expose independent full-body display, analysis eligibility, per-metric reasons and experimental multiview/view epochs. Adaptive resolution reacquires without killing the session. Completed-rep AI retains its original view/time; current baselines reset. No arbitrary-angle accuracy is claimed."},{title:"Local history and recordings",stack:"IndexedDB \xB7 SHA-256 source identity \xB7 MediaRecorder \xB7 browser/profile/origin storage",body:"Atomic session/media writes; unchanged originals/reports remain immutable. Reopen validates data and never requests inference. Live recordings have approximate timing and bounded metrics/evidence; saved JPEGs retain exact original sample timestamps. No account sync; exports are the portable backup."}],Yv=[["Polished session review","f4a987a retains stopped live recordings, accepted cards and seven historical metrics until New Start. Late-finalization, opt-out, unsupported/failed encoding and stale-live-overlay checks pass. History video/notes, measurement inspector, slow playback and reduced motion pass11 scoped polish checks; visible comparison rep buttons pass22 checks."],["Scope hold and identity","Chat is on hold: no chat UI or endpoints. The small biomechanics logo is a movement identity, not a claim of gait/non-squat support. Physical iPhone/venue and independent angle/orbit accuracy remain unverified."],["Remaining implementation","FE-6 OpenCap dual-track UI; UX-3 evidence-bound region accents; selectable goal/reference setup; VIEW-2\u20135 automatic viewpoint, identity, bounded filtering and calibration; stronger temporal-claim acceptance. Exact sequential decode and memory profiling remain BE-5 work. These are code/engineering gaps, not only missing device evidence."],["Remaining external acceptance","Actual iPhone/Mac venue capture, codec, orientation, background/lock, reconnect, recording replay and end-to-end latency; broader contrast/text-zoom/screen-reader review; independent per-view/orbit angle, identity and false-cue references. Final Wren passed3/3 on f4a987a. Native OpenCap is deferred; cloud sync and unsaved crash recovery are outside the local demo."],["Local history acceptance","qa/history-root.json passes22 journeys; qa/history-races.json passes6 lifecycle and storage-management recovery checks; storage browser verification passes10 groups. Live finalized video/JSON/JPEG failure recovery is available. Recorded replay makes no new inference; live video alignment is explicitly approximate."],["Geometry and missing data","Latest npm test passed110 harness tests and8 launcher/doctor tests (118 total), with no failures, cancellations or skips. Geometry, missing data, continuity and runtime behavior are tested without claiming anatomical accuracy."],["Current Heavy timing and coverage","Heavy tracked clear-squat at 57/57 frames and supported-squat at 90/90. Each yielded two complete reps. Bottom errors are 0 and 67 ms for both clips, within the unchanged 150 ms tolerance. The difficult original sample has 28/53 usable frames and no trusted reps. The front-view challenge has no usable projected measurements."],["Heavy cross-runtime agreement","The Python Tasks check uses the same Heavy v1 weights and independently decoded RGB video. Its two supported-fixture knee values differ from Chrome by 0.09\xB0 and 0.78\xB0. Source, report and model hashes are recorded. This is agreement between implementations; independent reference joint angles remain unavailable."],["Exploratory capture coverage","Heavy produced 134/135 usable frames in side-gym, 105/135 in side-mirror and 135/135 in side-busy-background. These clips explore tracking behavior and do not supply labeled angle-accuracy evidence. The explicit Full fallback also passed the supported timing labels."],["Source timeline and decoder matrix","Independent ffprobe checks account for 57/57 clear and 90/90 supported timestamps. Separate synthetic decoder QA ran through the explicit Full path: 30 Hz and rotated 30 Hz inputs retained 30/60 frames, 7 Hz retained 14/14, and a variable-rate input retained 21/21. Every reported timestamp matched a source frame. Three grayscale pixel comparisons per variant stayed below the 3/255 mean absolute RGB error limit. Rotation, malformed input and cancellation passed. This does not implement exact full-rate decoding."],["Local raw-pose export","The onPoseFrame API and built review export retain all 33 normalized xyz and 33 estimated world xyz slots with timestamp/model provenance. Missing probabilities remain null. Export stays local and is excluded from CoachPacket. The world coordinate origin is the model-estimated hip midpoint; these values are not calibrated motion-capture truth."],["JPEG and browser acceptance","Current Heavy packets use source JPEGs at 1,067/3,000 ms for clear-squat and 1,600/4,333 ms for supported-squat. Browser verification checks source pixels, source binding, the synchronized overlay, sample stepping and clipboard with no third-party requests. The current prebuilt root preview passes15 controlled-provider checks; final Seldon product rerun passes3/3 on f4a987a."],["OpenCap importer verification","Nine constructed-data tests cover units, malformed rows, source/model/motion hashes, trimming/gaps, boundary rounding and playback lookup. A browser synthetic import check also passed. The actual host preflight reports unsupported-runtime. Native inference is deferred per the user. No real OpenCap inference, 3D angle accuracy or MediaPipe/OpenCap accuracy comparison has been performed."],["Historical Full provider evidence","The archived Full baseline preserves the old reports and JPEGs. That supported clip supplied the successful local ChatGPT request and earlier hosted harness run. The live response cited six approved measurement IDs and both image IDs. Do not substitute the current Heavy numbers into that historical result."],["Current root readiness and retained history","Production c1c9378 passed20 fresh-build readiness gates with Heavy,57/57 samples and0/67ms bottom errors. It also passed15 controlled-provider lifecycle and7 real-provider checks. These are scoped results; subsequent restyles need affected-gate reruns. No angle-accuracy or Wren qualification claim."],["Final hosted acceptance","First integrated Wren product run8c85e97b passed3/3 on frozen2ad37f8: recorded/history, comparison and live setup/navigation without camera. Reconciled account before polished rerun:16 granted,5 used,11 remaining. Rep-menu difficulty was fixed with visible buttons. Final f4a987a polished rerun2151c1b9 passed3/3: GO for hands-on demo testing. Account now8used/8remaining. Persona/usability access is unavailable."],["Live browser evidence","Heavy real-clip captureStream processed37 frames with72 busy drops, mean76.8ms/max164.6ms local processing latency and one stabilized rep callback with its exact JPEG. Two reps were reconstructed; the final event lacked later samples and was withheld. This is not phone-to-Mac latency. Two Chrome contexts also verified real WebRTC decoded pixels and Stop cleanup."],["Stacked cue browser checks","Smoke playback verification passed retained cards, no duplicate replay/seek events, source/model resets and no repeated inference using a controlled provider. Live local-camera verification retained two AI cards on Stop and cleared them on new Start. Current caps: 12 smoke cards and six live AI cards."],["Real root AI","qa/root-live-chatgpt.json records real GPT-6.1 Sol, one request, source images 1,067/3,000 ms, valid citations and cues for both reps without extra seek requests."],["Experimental multiview compatibility","Actual Heavy output had 57 frames and observed confidence for 1,881 points per coordinate representation. Left knee/hip estimates were available; occluded right joints and front-only proxies on this side view were withheld. This proves schema/abstention compatibility, not angle accuracy."],["Public HTTPS real coaching passed","Public phone page, real WebRTC, Heavy and real ChatGPT/local feedback return pass across two Chrome contexts with a fixture-backed camera. One request uses phase JPEGs1205/1605/1937ms; response returns in10.209s as historical view1 coaching after resize. Stop clears tracks/captions. Physical iPhone and venue latency remain."],["Latest integrated browser checks","Root15 controlled-provider production-preview checks pass. Combined live QA passes adaptive dimensions, old-view historical AI and subsequent fresh reps, five requests with three exact phase JPEGs, offline zero requests, QR cleanup and real WebRTC feedback. Processing means74/77ms are local processing, not network latency."],["Stable live layout","Seven layout checks pass with representative cards and real fixture playback. Desktop1400/1280 uses a stable520px stage and390px feed. Mobile390\xD7844 uses405.11px stage; first card ends834.20px, inside viewport. No overflow or page errors. These are layout checks, not live inference or physical-device results."],["Fresh checkout setup","Fresh efe97bd starts without dependencies, pose assets or dist. Setup installs both locked trees and verifies Full/Heavy plus four runtime files; TypeScript/Vite build and final read-only doctor pass. Existing demo ports are untouched; their health result is not a runtime test of this fresh build. Phone sender needs no model installation."]],jv=[["Read current contracts first","Read tracker.md, AI-AMENDMENTS.md, docs/frontend-design-amendments.md, docs/frontend-harness-amendments.md and harness/FRONTEND-HANDOFF.md. New one-Start/stacked-feed requirements supersede historical manual preview/send stories."],["Preserve the verified core","Root Heavy and real ChatGPT work. Reuse analyzeSquat, source-time overlays, trace/profile helpers, prepareCoachingBundle and chatGPTProvider; keep shared principles/validation. Do not replace tested motion with a private UI geometry engine."],["Finish the designed session","Preserve the root retained-feed integration now covered by15 production-preview checks: source timestamps, short action, Why details, Stop history, deduplicated replay and rejected stale results. Complete unified setup, region highlighting and full accessibility without duplicating inference."],["Reuse phone and live infrastructure","Use startLiveSquat on the received MediaStream, exact cached completed-rep images, connectReceiver and the local proxy. Phone uses authenticated polling; QR generation stays local. Never expose the credential provider. Public real-provider return passes; physical-device acceptance remains."],["Consume experimental contracts honestly","Consume LiveSample poseDisplayFrame, analysisEligible, metricValidity, multiView and experimental viewGuard; LiveRep adds epoch and exact phase JPEGs. Reset current baselines on epochs, retain completed-rep historical AI with original view/time labels. Estimates remain experimental and missing values stay missing."],["Preserve two sources; finish temporal acceptance","Compare examples already analyzes two distinct recordings with independent hashes, reports, selected reps and clocks;22 local checks pass. Preserve retained-A/B-only retry and no inference on seeks. Live three-phase evidence and real-provider return pass; reversed-sequence and unsupported temporal-claim acceptance remain."],["Launch and final acceptance","Use npm run demo and docs/quickstart.md. Default startup is private; phone mode exposes dedicated signaling only. Local118-test suite passes; first Wren product run passed3/3; polished rerun passed3/3 with8 simulations remaining. Keep physical-device gates explicit. Native OpenCap and broad movement expansion remain deferred."]],Qv=[["What counts as a quality rep","Complete the intended motion and compare depth and tempo with the lifter\u2019s stated goal or a matched personal baseline. Keep camera setup, stance, footwear and load comparable. Check complete reps and usable evidence before interpreting changes. A universal form score is not supported by these fixtures."],["What the numbers can say","Use projected knee, torso, hip and shin angles, phase timing, ankle-closure change and normalized depth proxies. Values describe a camera projection. Small differences may reflect tracking error; independent annotations and repeated captures are needed to establish meaningful change thresholds."],["Capture and post-processing","Record the full lifter from a static level side view. Keep near-side joints and feet visible. The 15 Hz sampler retains decoded presentation timestamps and skips duplicate times. The decoder matrix documents high-rate subsampling and variable-rate behavior. Exact sequential source-frame processing remains future work."],["Review during the full video","Play the full local video, step analyzed samples, slow playback and seek by phase or evidence cue. Overlay and metrics follow the video clock and leave gaps when evidence is unavailable. ChatGPT explains an explicitly approved packet once; validated cues can appear throughout replay without repeatedly uploading the video."],["MediaPipe Heavy default","The user selected Heavy v1 as the default after both pinned variants were benchmarked. The historical paired CPU run found Full faster and closer to supported-fixture timing labels. Heavy passes the same 150 ms acceptance threshold and is now verified across seven clips. Model size does not establish greater measured accuracy; source reference angles are still missing."],["OpenCap Monocular scope","Pinned source revision 7c5c1dd has a PolyForm Noncommercial code license plus separate SMPL asset terms. The preprint reports aggregate rotational error for its own validation setup; that result does not establish MoveIDE accuracy. The importer is locally verified on constructed files. A suitable external GPU runtime, authorized assets, camera/subject metadata, original-frame mapping and independent references are required for a real run."]],Nm=[["BE-1 \xB7 Local pose report","Verified \xB7 merged in PR #11","Heavy is the user-selected default, with Full retained and tested. Seven fixture inputs produce schema-valid reports and capture guidance. Optional local raw-pose output retains all normalized and estimated world coordinates."],["BE-2 \xB7 Rep measures and packet","Verified","The current Heavy positive fixtures each yield two reps, six usable report values and two source JPEGs. Extended profiles and phase anchors remain available; old Full evidence is archived."],["BE-3 \xB7 Eligible ChatGPT connection","Passed","Loopback sign-in and eligible-model discovery passed on the demo laptop. Current changes do not rerun account sign-in."],["BE-4 \xB7 Evidence-linked interpretation","Real smoke and root verified","Current Heavy plus GPT-6.1 Sol passed bounded source evidence and playback citations. Recorded evidence uses bottoms; public live AI also passed three sampled phase images. Full temporal visual understanding is not established."],["FE-1 \xB7 Clip import","Merged \xB7 on the shared harness","The root workbench opens clear-squat.mp4 with Heavy through the shared harness APIs; the duplicate measuring code is removed."],["FE-2 \xB7 Synchronized overlay","Merged \xB7 on the shared harness","The root product runs Heavy on clear-squat.mp4 with the shared source clock. Final Wren passed3/3 on f4a987a, including recorded evidence/overlay review; independent angle accuracy remains unmeasured."],["FE-3 \xB7 Rep compare and handoff","Two reps and two sources implemented","Shared report/profile and optional developer exports work. Normal coaching is automatic. Compare examples analyzes two sources with independent hashes, reports, selected reps and phase anchors; browser acceptance is in qa/two-recording-comparison.json."],["FE-4 \xB7 Connected coaching","Real root AI verified","Root one Start made one real GPT-6.1 Sol request with exact evidence; both rep cues visible and no inference on seek. Current f4a987a adds9 real-provider checks, including History/reload without inference; final Wren3/3 passes."],["BE-5 \xB7 Source coverage and accuracy","Partially verified","Timestamp accounting, 30 Hz/7 Hz/VFR/rotation decoder checks, raw-data retention and Heavy fixture validation passed. Exact sequential decode, independent angle/annotator errors, repeated captures and memory profiling remain open."],["FE-5 \xB7 Replay and coaching cues","Root retained feed development-verified","Fifteen controlled-provider checks cover retained short cards, expanded reasoning/citations, delayed ordering, no replay duplicates, Stop/reset and source races. Historical built Trace/rate/step/seek readiness remains recorded separately."],["BE-6 \xB7 Complete sampled MediaPipe outputs","Verified in the harness","The optional onPoseFrame callback and local export preserve 33-slot normalized xyz and world xyz, nullable confidence, model provenance and decoded timestamps. Unit and real Heavy browser checks pass. Raw data stays outside CoachPacket."],["BE-7 \xB7 Source-bound OpenCap import","Importer verified \xB7 native inference deferred","Nine constructed-data tests and Chrome File/import smoke pass. The typed adapter verifies source/model/motion hashes and explicit frame mapping, preserves units/signs and reports imported-unverified status. Real-capture inference and accuracy are unverified."],["FE-6 \xB7 Dual-track video review","Amendment published \xB7 integration pending","Use one video clock and source identity for MediaPipe and imported OpenCap tracks. Keep units/status distinct, preserve missing rows, reset traces and cues on clip changes, and leave video review usable while coaching runs. Native OpenCap execution remains deferred."],["R-1 \xB7 OpenCap Monocular benchmark","Native inference deferred","The user selected Heavy plus OpenCap import for current delivery. Resume native inference only with compatible runtime/assets, appropriate capture metadata, original-frame mapping and independent accuracy references. No real OpenCap inference or accuracy benchmark has been completed."],["LIVE-1\u20133 \xB7 One-action live tracking","Local camera + stacked feed browser verified","Heavy uses bounded frame scheduling and exact evidence. Two local AI cards persisted through Stop and reset on new Start. Target 110\xB0 is illustrative projected depth, not a universal standard."],["LIVE-4\u20136 \xB7 Phone and AI coaching","Public browser phone-path real AI verified","HTTPS, real WebRTC, Heavy, three-phase real ChatGPT request, returned historical coaching and cleanup pass. Physical iPhone remains unverified."],["LIVE-7\u20139 \xB7 Demo and acceptance","Demo QA passed \xB7 physical rehearsal pending","Two distinct example videos and the one-action demo are implemented. Final Seldon task workflows passed3/3; physical-device rehearsal and independent accuracy remain open."],["UX-1\u20133 \xB7 Stable feed, setup and highlights","Retained feed and responsive layout verified","Root15 checks and live/smoke browser checks pass. Seven representative-card layout checks cover desktop and mobile with stable video. Unified setup, region-specific emphasis and broader accessibility remain."],["VIEW-1\u20133 \xB7 Gated view diagnostics","Experimental live integration browser-verified","Per-metric validity, full-body display, epoch reset and adaptive-resolution recovery are integrated. The app still declares side view and uses a fixed110\xB0 goal. Automatic person/phase reference calibration and view selection/estimation remain implementation work; real frontal/oblique annotations and cue accuracy are separate gates."],["VIEW-4\u20136 \xB7 Moving camera and orbit","Required target \xB7 unverified","The current continuity heuristic cannot infer viewpoint or distinguish camera from athlete motion. Automatic view estimation, persistent identity/left-right continuity, bounded filtering and canonical/reference construction need implementation as well as tests. Independent orbit references remain an external research gate."],["TEMP-1 \xB7 Phase-aware evidence","Live cache and phase bundle browser-verified","Four focused phase-evidence tests and combined browser QA pass. Public real ChatGPT uses three exact phase JPEGs and returns historical coaching. Evidence-ID validation does not prove sequencing claims; reversed-sequence and bottom-only negative acceptance remain."],["R-2 \xB7 Independent accuracy","Reference data missing","Measure error, coverage, latency, repeatability and false cues per view/metric using independent annotations/calibrated truth. Timing and same-model cross-runtime agreement are not angle accuracy."],["HIST-1\u20135 \xB7 Local recordings and history","Implemented \xB7 scoped local acceptance passed","22 history journeys,6 save/source/recovery races and10 storage groups pass. Live recording/replay and unsaved downloads pass in Chrome. Source/video clocks remain distinct; local-only history does not imply physical iPhone or crash recovery."],["HIST-6 \xB7 Completed-session replay","Verified \xB7 retains until new Start","Stop releases camera and current tracking but keeps playable video, historical metrics and accepted notes. Opt-out retains only temporary replay. Unsupported recording and late finalization races pass."],["UX-4 \xB7 Replay polish and movement identity","11 replay checks \xB7 22 comparison checks","Stable video/notes layout, slow playback, measurement inspector, reduced motion and accessible rep buttons. Shared jointed logo is branding, not a gait-analysis claim."],["DEV-1 \xB7 Setup and AI handoff","Fresh setup, build and doctor verified","README, Claude/Codex prompts, developer test matrix and read-only doctor delivered. Fresh efe97bd missing-dependency/model setup, pinned hashes and production build pass; no camera/account/runtime acceptance is inferred."]];function pn({links:e}){let t=xf();return(0,E.jsx)("div",{"aria-label":"Sources",style:{display:"flex",flexWrap:"wrap",gap:"8px 16px",marginTop:22,paddingTop:16,borderTop:`1px solid ${t.stroke.secondary}`,fontSize:12},children:e.map(([l,a])=>(0,E.jsx)("a",{href:a,style:{color:t.text.link,textUnderlineOffset:3},children:l},a))})}function Gf(){let e=xf(),[t,l]=(0,Ju.useState)("Workflow"),[a,n]=(0,Ju.u
