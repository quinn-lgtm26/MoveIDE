)"},accent:{primary:"var(--accent)"}}}var z=be(hn()),_="https://github.com/quinn-lgtm26/MoveIDE/blob/main",Yv=["Workflow","Story status","System","Verification","Squat methodology","Frontend handoff"],Bf=[{id:"01",title:"One Start, one coached session",owner:"Shared \xB7 contracts established",work:"Start coordinates local Heavy tracking, timestamped measurements, exact source JPEGs, coaching principles and asynchronous interpretation. Evidence packets remain internal, with optional developer exports. The session amendment replaces the old manual preview/send workflow.",proof:"The clear sample has independent rep-bottom labels at 1,067 and 2,933 ms; the supported regression uses 1,600 and 4,400 ms. Each declares a 150 ms tolerance. Joint-angle reference annotations remain unavailable."},{id:"02",title:"Build and verify the first real angle",owner:"Motion \xB7 verified / Product integration \xB7 frontend owner",work:"MediaPipe Heavy v1 is now the user-selected default. A local browser worker records decoded presentation timestamps and computes same-side projected angles. Full remains an explicit tested alternative. Both asset hashes are checked during setup and inference.",proof:"Heavy passed the seven-fixture workflow. The clear sample tracks 57/57 frames with two bottoms at 1,067 and 3,000 ms. Optional onPoseFrame capture preserves 33 normalized xyz and world xyz slots per sample, with nullable confidence. Built smoke verified its local export."},{id:"03",title:"Measure two reps and preview their evidence",owner:"Shared harness integrated in PR #13",work:"The local trace and profile expose knee, torso, hip, shin, ankle-change and normalized depth proxies with start/bottom/return anchors. Six selected report measurements and two unannotated JPEGs form the coaching packet. Keep report and raw-pose export local.",proof:"Heavy yields six usable measurements and two source JPEGs for each positive fixture. PR #13 adopts the shared Heavy engine and clear fixture in the root frontend. The one-Start integration is being verified separately from the historical readiness result."},{id:"04",title:"Verify ChatGPT sign-in and evidence interpretation",owner:"Provider \xB7 real Heavy smoke verified / FE-4 \xB7 controlled root QA passed",work:"The eligible account completed loopback sign-in and model discovery; the updated local Heavy preview retains that connection without making a new inference request. The historical GPT-6.1 Sol request interpreted six Full-baseline measurements and two approved public JPEGs with validated evidence IDs. A new one-Start Heavy clear-fixture request passed with GPT-6.1 Sol: six measurements, two JPEGs and validated playback cues. OpenCap has no live inference claim.",proof:"Validated observation IDs resolve to source timestamps for replay cues. The full video, landmark arrays and raw depth remain local. The frontend must bind asynchronous results to the active clip and selected pair, preserve playback, and clear stale cues."},{id:"05",title:"Integrate and verify the final build",owner:"Integration + final QA \xB7 open",work:"PR #13 is merged at e5dea78 and adopts the shared Heavy harness. Current scope is a one-action recorded review, two-video target-relative demo, and real-time squat capture on iPhone/Mac. Native OpenCap and broad movement expansion remain deferred.",proof:"The historical Full harness smoke passed both Seldon cases on 2a6511f and spent two simulations. The last confirmed14 balance now has an additional frontend run pending reconciliation (expected13); further dispatch stays on hold until the complete integrated product is ready. Native OpenCap inference is deferred by the user because compatible GPU setup and assets are unavailable."}],Nm=[{title:"Browser workbench",stack:"React \xB7 TypeScript \xB7 Vite \xB7 Canvas 2D",body:"A single Start action coordinates analysis and coaching. Local tracking and slower interpretation run asynchronously, with timestamped notes reused during playback. Keep evidence exports under developer details and expose account setup once."},{title:"Local measurement engine",stack:"Browser worker \xB7 MediaPipe Tasks Vision 1.2.2 \xB7 WASM \xB7 Heavy v1",body:"Heavy is the default and Full remains selectable. Setup stages both pinned assets with SHA-256 verification. The 15 Hz sampler records actual decoded timestamps. The standard report carries 33 x/y/visibility slots; optional onPoseFrame capture preserves normalized xyz and estimated world xyz with nullable visibility/presence. Keep coordinate definitions and model provenance attached."},{title:"Report, evidence and replay",stack:"AnalysisReport v1 \xB7 local raw-pose trace \xB7 CoachPacket v1 \xB7 JPEG",body:"The report and extended profile describe projected squat measurements and phases. Raw model depth is an estimate. The bounded coaching packet includes only selected metrics, context and approved source images. Validated response IDs drive timestamped playback cues without requesting the model again on every frame."},{title:"Optional provider",stack:"Node loopback \xB7 OAuth with PKCE \xB7 Responses \xB7 validated output",body:"Credentials remain in the loopback service. Disclosed Start authorizes selected source JPEGs and bounded measurements automatically. Playback never triggers new inference; Stop cancels late work. Live requests are capped and evidence-bound. No full-video upload is claimed."},{title:"Optional OpenCap research import",stack:"Text .mot parser \xB7 scaled-model/video hashes \xB7 explicit source-row mapping",body:"The importer accepts separately produced OpenSim kinematics and labels them imported-unverified. It preserves source frame indices, coordinate units and model signs. It does not execute OpenCap or turn MediaPipe depth into OpenSim kinematics. Native execution is unavailable on this Darwin arm64 machine without a compatible NVIDIA runtime, approved assets and calibrated capture metadata."},{title:"Live squat capture",stack:"MediaStream \xB7 Heavy worker \xB7 bounded history \xB7 optional WebRTC",body:"One inference frame in flight; drop work instead of queueing latency. Exact accepted pixels supply cached JPEGs. iPhone WebRTC needs trusted HTTPS; Continuity Camera is an alternative Mac source. Browser transport passes; physical iPhone validation remains pending."}],Gv=[["Geometry and missing data","Straight leg \u2192 0\xB0 flexion; right angle \u2192 90\xB0. Missing or low-visibility required joints yield unavailable measures. Pixel aspect ratio, selected-side continuity and tracking gaps have automated coverage. The combined local suite now passes 54 tests, including live transport and backpressure. These formula checks do not establish anatomical angle accuracy."],["Current Heavy timing and coverage","Heavy tracked clear-squat at 57/57 frames and supported-squat at 90/90. Each yielded two complete reps. Bottom errors are 0 and 67 ms for both clips, within the unchanged 150 ms tolerance. The difficult original sample has 28/53 usable frames and no trusted reps. The front-view challenge has no usable projected measurements."],["Heavy cross-runtime agreement","The Python Tasks check uses the same Heavy v1 weights and independently decoded RGB video. Its two supported-fixture knee values differ from Chrome by 0.09\xB0 and 0.78\xB0. Source, report and model hashes are recorded. This is agreement between implementations; independent reference joint angles remain unavailable."],["Exploratory capture coverage","Heavy produced 134/135 usable frames in side-gym, 105/135 in side-mirror and 135/135 in side-busy-background. These clips explore tracking behavior and do not supply labeled angle-accuracy evidence. The explicit Full fallback also passed the supported timing labels."],["Source timeline and decoder matrix","Independent ffprobe checks account for 57/57 clear and 90/90 supported timestamps. Separate synthetic decoder QA ran through the explicit Full path: 30 Hz and rotated 30 Hz inputs retained 30/60 frames, 7 Hz retained 14/14, and a variable-rate input retained 21/21. Every reported timestamp matched a source frame. Three grayscale pixel comparisons per variant stayed below the 3/255 mean absolute RGB error limit. Rotation, malformed input and cancellation passed. This does not implement exact full-rate decoding."],["Local raw-pose export","The onPoseFrame API and built review export retain all 33 normalized xyz and 33 estimated world xyz slots with timestamp/model provenance. Missing probabilities remain null. Export stays local and is excluded from CoachPacket. The world coordinate origin is the model-estimated hip midpoint; these values are not calibrated motion-capture truth."],["JPEG and browser acceptance","Current Heavy packets use source JPEGs at 1,067/3,000 ms for clear-squat and 1,600/4,333 ms for supported-squat. Browser verification checks source pixels, source binding, the synchronized overlay, sample stepping and clipboard with no third-party requests. Final production browser QA is still pending."],["OpenCap importer verification","Nine constructed-data tests cover units, malformed rows, source/model/motion hashes, trimming/gaps, boundary rounding and playback lookup. A browser synthetic import check also passed. The actual host preflight reports unsupported-runtime. Native inference is deferred per the user. No real OpenCap inference, 3D angle accuracy or MediaPipe/OpenCap accuracy comparison has been performed."],["Historical Full provider evidence","The archived Full baseline preserves the old reports and JPEGs. That supported clip supplied the successful local ChatGPT request and earlier hosted harness run. The live response cited six approved measurement IDs and both image IDs. Do not substitute the current Heavy numbers into that historical result."],["Historical product readiness audit","The built root workbench at 5225a3d reaches Ready, decodes both evidence images and copies text matching its preview with no page errors. It still uses the older Full path and original hard sample. Heavy selection, the clear fixture, labeled timing, two usable comparisons and same-origin assets fail. Both reps show unavailable knee flexion and duration. The probe reports readyForFinalQA=false; passing 25 root tests and a build does not close this integration gate. PR #13 has since integrated shared Heavy; this old verdict is not the current build verdict. Final product QA must be rerun."],["Final hosted acceptance","Both historical harness-only Seldon cases passed on 2a6511f in experiment 9c9dabb7-9f02-4925-88e2-56eb9172b505. Harness debit was two, leaving a last-confirmed14. The merged frontend ledger records another run with debit pending; expected remaining13. The two final product cases still require one reachable integrated build, and all remaining simulations are held until it is complete."],["Live browser evidence","Heavy real-clip captureStream processed37 frames with72 busy drops, mean76.8ms/max164.6ms local processing latency and one stabilized rep callback with its exact JPEG. Two reps were reconstructed; the final event lacked later samples and was withheld. This is not phone-to-Mac latency. Two Chrome contexts also verified real WebRTC decoded pixels and Stop cleanup."]],jv=[["Latest repository state","Main includes PR #13 at e5dea78: shared Heavy engine, clear sample and overlay. Automatic coaching follows the one-action amendment. Smoke review no longer exposes a handoff step. Final production acceptance and Wren reruns remain open."],["Verify the integrated product","Rerun readiness against the latest exact root build. Verify automatic AI, timestamped playback cues, cancellation and source replacement. Historical failures remain as history. Reconcile the last-confirmed14 balance against the newly recorded frontend run (expected13); hold further Seldon dispatch until the complete build is ready."],["Run the harness locally","Install the locked dependencies with npm --prefix harness ci. Run test, verify:fixtures, build and verify:build. Setup verifies and stages both model assets; Heavy is the default. verify:source-timeline checks saved results against source PTS. Decoder matrix and OpenCap parser checks remain separate from pose accuracy claims."],["Motion and raw tracking pickup","Call analyzeSquat(source, { clipId, signal, onProgress, onPoseFrame }). The optional callback gives local raw samples; the returned AnalysisReport v1 stays compatible. Keep video/report/raw trace bound to one clip generation. Show model name, coverage and unavailable samples. Describe stepping as analyzed samples unless source-frame coverage is independently known."],["Comparison and coaching pickup","Use prepareCoachingBundle with the exact analyzed source and two distinct rep IDs. Preview that packet and its returned JPEGs, use formatManualHandoff for copying, and expose torso and phase/profile details. Use getCoachingTimeline once per validated response and coachingMarkerAt on the video clock. A selection change invalidates old results."],["OpenCap frontend pickup","Offer Import OpenCap result while native execution requires external GPU setup. Require the original video, .mot, scaled model and explicit per-row mapping manifest. Show imported-unverified status and a separate coordinate trace in OpenSim units. Preserve gaps and model signs. Clear imports on clip replacement. A 3D skeleton renderer and OpenCap-specific coaching contract still require separate integration and validation."],["Full movement-analysis roadmap","Squat remains the implemented movement protocol. Additional exercises need their own capture instructions, metric definitions, phase logic, independent labels and acceptance fixtures. Shared video, raw tracking and trace review provide a base for that work. Do not present generic pose output as verified analysis of every movement."],["Final release gate","Integrate the shared APIs, run product browser QA on the exact build, then run both Seldon cases together with the approved public fixture. Preserve the 14 remaining simulations until that point. Independent angle annotations, repeated-capture validation and exact source decoding remain future validation work. Native OpenCap execution is deferred per the user."]],Qv=[["What counts as a quality rep","Complete the intended motion and compare depth and tempo with the lifter\u2019s stated goal or a matched personal baseline. Keep camera setup, stance, footwear and load comparable. Check complete reps and usable evidence before interpreting changes. A universal form score is not supported by these fixtures."],["What the numbers can say","Use projected knee, torso, hip and shin angles, phase timing, ankle-closure change and normalized depth proxies. Values describe a camera projection. Small differences may reflect tracking error; independent annotations and repeated captures are needed to establish meaningful change thresholds."],["Capture and post-processing","Record the full lifter from a static level side view. Keep near-side joints and feet visible. The 15 Hz sampler retains decoded presentation timestamps and skips duplicate times. The decoder matrix documents high-rate subsampling and variable-rate behavior. Exact sequential source-frame processing remains future work."],["Review during the full video","Play the full local video, step analyzed samples, slow playback and seek by phase or evidence cue. Overlay and metrics follow the video clock and leave gaps when evidence is unavailable. ChatGPT explains an explicitly approved packet once; validated cues can appear throughout replay without repeatedly uploading the video."],["MediaPipe Heavy default","The user selected Heavy v1 as the default after both pinned variants were benchmarked. The historical paired CPU run found Full faster and closer to supported-fixture timing labels. Heavy passes the same 150 ms acceptance threshold and is now verified across seven clips. Model size does not establish greater measured accuracy; source reference angles are still missing."],["OpenCap Monocular scope","Pinned source revision 7c5c1dd has a PolyForm Noncommercial code license plus separate SMPL asset terms. The preprint reports aggregate rotational error for its own validation setup; that result does not establish MoveIDE accuracy. The importer is locally verified on constructed files. A suitable external GPU runtime, authorized assets, camera/subject metadata, original-frame mapping and independent references are required for a real run."]],Rm=[["BE-1 \xB7 Local pose report","Verified \xB7 merged in PR #11","Heavy is the user-selected default, with Full retained and tested. Seven fixture inputs produce schema-valid reports and capture guidance. Optional local raw-pose output retains all normalized and estimated world coordinates."],["BE-2 \xB7 Rep measures and packet","Verified","The current Heavy positive fixtures each yield two reps, six usable report values and two source JPEGs. Extended profiles and phase anchors remain available; old Full evidence is archived."],["BE-3 \xB7 Eligible ChatGPT connection","Passed","Loopback sign-in and eligible-model discovery passed on the demo laptop. Current changes do not rerun account sign-in."],["BE-4 \xB7 Evidence-linked interpretation","Historically live verified","GPT-6.1 Sol interpreted the six approved Full-baseline measurements and two JPEGs. Evidence IDs validated. Heavy now has a separate one-Start real-provider verification; OpenCap remains unverified."],["FE-1 \xB7 Clip import","Merged \xB7 on the shared harness","The root workbench opens clear-squat.mp4 with Heavy through the shared harness APIs; the duplicate measuring code is removed."],["FE-2 \xB7 Synchronized overlay","Merged \xB7 on the shared harness","The root product runs Heavy on clear-squat.mp4 with the shared source clock. Final Seldon acceptance remains."],["FE-3 \xB7 Rep compare and handoff","Merged \xB7 on the shared harness","Rep compare uses the shared Heavy packet and two source JPEGs; copy handoff works. measure-squat passed on Seldon (3 of 16 simulations used)."],["FE-4 \xB7 Connected coaching","One-Start implemented \xB7 real smoke and controlled root QA passed","Smoke automatically prepares and sends evidence after Start. Root workbench adoption passed eight Chrome checks using a controlled provider. Final real-provider and hosted QA remain separate gates."],["BE-5 \xB7 Source coverage and accuracy","Partially verified","Timestamp accounting, 30 Hz/7 Hz/VFR/rotation decoder checks, raw-data retention and Heavy fixture validation passed. Exact sequential decode, independent angle/annotator errors, repeated captures and memory profiling remain open."],["FE-5 \xB7 Replay and coaching cues","Root automatic coaching + traces \xB7 final QA pending","Shared overlay, steps and raw export verified. Latest smoke change makes coaching automatic from Start and hides developer packets. Root frontend uses shared tracking; automatic coaching passed controlled-provider browser checks."],["BE-6 \xB7 Complete sampled MediaPipe outputs","Verified in the harness","The optional onPoseFrame callback and local export preserve 33-slot normalized xyz and world xyz, nullable confidence, model provenance and decoded timestamps. Unit and real Heavy browser checks pass. Raw data stays outside CoachPacket."],["BE-7 \xB7 Source-bound OpenCap import","Importer verified \xB7 native inference deferred","Nine constructed-data tests and Chrome File/import smoke pass. The typed adapter verifies source/model/motion hashes and explicit frame mapping, preserves units/signs and reports imported-unverified status. Real-capture inference and accuracy are unverified."],["FE-6 \xB7 Dual-track video review","Amendment published \xB7 integration pending","Use one video clock and source identity for MediaPipe and imported OpenCap tracks. Keep units/status distinct, preserve missing rows, reset traces and cues on clip changes, and leave video review usable while coaching runs. Native OpenCap execution remains deferred."],["R-1 \xB7 OpenCap Monocular benchmark","Native inference deferred","The user selected Heavy plus OpenCap import for current delivery. Resume native inference only with compatible runtime/assets, appropriate capture metadata, original-frame mapping and independent accuracy references. No real OpenCap inference or accuracy benchmark has been completed."],["LIVE-1\u20133 \xB7 One-action live tracking","Browser engine verified \xB7 UI integration in progress","One Start opens the default camera and runs Heavy with bounded work. Unknown tracking stays neutral.110\xB0 is an illustrative projected depth target, not a universal good-squat threshold."],["LIVE-4\u20136 \xB7 Phone and AI coaching","Browser transport verified \xB7 device validation pending","Exact-source JPEGs support bounded per-rep AI. WebRTC has separate invites and expiry; no credential service is exposed. Physical iPhone HTTPS/Wi-Fi and final real-provider sessions remain required."],["LIVE-7\u20139 \xB7 Demo and acceptance","Product amendment published \xB7 final QA pending","Compare two attributed reliable clips against a disclosed target; capture failure is not bad posture. Finish one-action demo and rerun two final Wren workflows on the same build."]];function ku({links:l}){let t=xf();return(0,z.jsx)("div",{"aria-label":"Sources",style:{display:"flex",flexWrap:"wrap",gap:"8px 16px",marginTop:22,paddingTop:16,borderTop:`1px solid ${t.stroke.secondary}`,fontSize:12},children:l.map(([e,a])=>(0,z.jsx)("a",{href:a,style:{color:t.text.link,textUnderlineOffset:3},children:e},a))})}function Yf(){let l=xf(),[t,e]=(0,Ju.useState)("Workflow"),[a,n]=(0,Ju.useState)("02"),u=Bf.find(({id:o})=>o===a)??Bf[1],i={color:l.text.secondary,fontSize:14,lineHeight:1.55,margin:"5px 0 0"},c={fontSize:16,fontWeight:650,margin:0},f={color:l.text.secondary,fontSize:12,fontWeight:650,margin:0,letterSpacing:"0.065em",textTransform:"uppercase"},r=`1px solid ${l.stroke.secondary}`,v={font:"in
