)"},accent:{primary:"var(--accent)"}}}var E=bt(hn()),M="https://github.com/quinn-lgtm26/MoveIDE/blob/main",G0=["Workflow","Story status","System","Verification","Squat methodology","Frontend handoff"],Bf=[{id:"01",title:"One Start, one coached session",owner:"Shared \xB7 contracts established",work:"Start coordinates local Heavy tracking, timestamped measurements, exact source JPEGs, coaching principles and asynchronous interpretation. Evidence packets remain internal, with optional developer exports. The session amendment replaces the old manual preview/send workflow.",proof:"One Start passed real ChatGPT on smoke and root. Root made one request with six measurements and source images at 1,067/3,000 ms; both rep cues resolved and seeking made no extra request. This is bounded evidence, not full-video interpretation."},{id:"02",title:"Build and verify the first real angle",owner:"Motion \xB7 verified / Product integration \xB7 frontend owner",work:"MediaPipe Heavy v1 is now the user-selected default. A local browser worker records decoded presentation timestamps and computes same-side projected angles. Full remains an explicit tested alternative. Both asset hashes are checked during setup and inference.",proof:"Heavy passed the seven-fixture workflow. The clear sample tracks 57/57 frames with two bottoms at 1,067 and 3,000 ms. Optional onPoseFrame capture preserves 33 normalized xyz and world xyz slots per sample, with nullable confidence. Built smoke verified its local export."},{id:"03",title:"Review two reps and source evidence",owner:"Shared harness integrated in PR #13",work:"Local phase traces, projected metrics and source evidence support review. Start dispatches bounded coaching automatically; packet/copy controls are developer-only. Timestamped concise cards stack in smoke/live and retain accepted history.",proof:"Production c1c9378 passed20 fresh-build readiness checks,15 controlled-provider lifecycle checks and7 real-provider checks. Retained short cards, Why, Stop/reset and source races pass. Latest9446951 restyle also passes15 production checks and the user-visible real Heavy/GPT demo shows two short retained cards. Two different video sources remain."},{id:"04",title:"Verify ChatGPT sign-in and evidence interpretation",owner:"Real root and public phone-path AI verified",work:"Public HTTPS phone delivery, real WebRTC, Heavy and real ChatGPT feedback return passed across two Chrome contexts using a fixture-backed camera. One request carried three phase JPEGs; the10.209-second response appeared as historical coaching after adaptive resize.",proof:"qa/phone-https.json records returned AI, local captions and Stop cleanup. This is browser-based phone-path evidence, not a physical iPhone test or network latency guarantee."},{id:"05",title:"Integrate and verify the final build",owner:"Integration + final QA \xB7 open",work:"Finish two-source comparison, final design/accessibility and physical iPhone acceptance. The experimental continuity guard, per-metric validity and sparse phase evidence are integrated; camera-orbit accuracy is still unverified.",proof:"86 harness and4 launcher tests pass. Fresh9446951 setup-only installs locked dependencies and pinned models; TypeScript/Vite build and dist hashes pass. Physical iPhone, independent accuracy and both final Wren workflows remain."}],Rm=[{title:"Browser workbench",stack:"React \xB7 TypeScript \xB7 Vite \xB7 Canvas 2D",body:"One Start coordinates analysis and coaching. Root, smoke and live retain concise timestamped cards with expandable reasons. Root passes15 controlled-provider production-preview checks. Preserve the shared controller, source resets and root/live navigation during design work."},{title:"Local measurement engine",stack:"Browser worker \xB7 MediaPipe Tasks Vision 1.2.2 \xB7 WASM \xB7 Heavy v1",body:"Heavy is the default and Full remains selectable. Setup stages both pinned assets with SHA-256 verification. The 15 Hz sampler records actual decoded timestamps. The standard report carries 33 x/y/visibility slots; optional onPoseFrame capture preserves normalized xyz and estimated world xyz with nullable visibility/presence. Keep coordinate definitions and model provenance attached."},{title:"Report, evidence and replay",stack:"AnalysisReport v1 \xB7 local raw-pose trace \xB7 CoachPacket v1 \xB7 JPEG",body:"The report and extended profile describe projected squat measurements and phases. Raw model depth is an estimate. The bounded coaching packet includes only selected metrics, context and approved source images. Validated response IDs drive timestamped playback cues without requesting the model again on every frame."},{title:"Optional provider",stack:"Node loopback \xB7 OAuth with PKCE \xB7 Responses \xB7 validated output",body:"Credentials remain in the loopback service. Disclosed Start authorizes selected source JPEGs and bounded measurements automatically. Playback never triggers new inference; Stop cancels late work. Live requests are capped and evidence-bound. No full-video upload is claimed."},{title:"Optional OpenCap research import",stack:"Text .mot parser \xB7 scaled-model/video hashes \xB7 explicit source-row mapping",body:"The importer accepts separately produced OpenSim kinematics and labels them imported-unverified. It preserves source frame indices, coordinate units and model signs. It does not execute OpenCap or turn MediaPipe depth into OpenSim kinematics. Native execution is unavailable on this Darwin arm64 machine without a compatible NVIDIA runtime, approved assets and calibrated capture metadata."},{title:"Live squat capture",stack:"MediaStream \xB7 Heavy worker \xB7 bounded history \xB7 optional WebRTC",body:"One pose frame in flight and no backlog; exact accepted pixels supply live JPEGs. Phone video enters the same Heavy controller; local/AI feedback returns by data channel. Dedicated HTTPS signaling uses phone long polling, while provider credentials stay local. Physical device and physical venue acceptance remains."},{title:"Experimental view and 3D diagnostics",stack:"createViewGuard \xB7 analyzeMultiViewFrame \xB7 explicit reason/epoch/provenance",body:"Integrated live samples expose independent full-body display, analysis eligibility, per-metric reasons and experimental multiview/view epochs. Adaptive resolution reacquires without killing the session. Completed-rep AI retains its original view/time; current baselines reset. No arbitrary-angle accuracy is claimed."}],Y0=[["Geometry and missing data","Final npm test passed86 harness tests and4 launcher tests, with no failures, cancellations or skips. Geometry, missing data, continuity and runtime behavior are tested without claiming anatomical accuracy."],["Current Heavy timing and coverage","Heavy tracked clear-squat at 57/57 frames and supported-squat at 90/90. Each yielded two complete reps. Bottom errors are 0 and 67 ms for both clips, within the unchanged 150 ms tolerance. The difficult original sample has 28/53 usable frames and no trusted reps. The front-view challenge has no usable projected measurements."],["Heavy cross-runtime agreement","The Python Tasks check uses the same Heavy v1 weights and independently decoded RGB video. Its two supported-fixture knee values differ from Chrome by 0.09\xB0 and 0.78\xB0. Source, report and model hashes are recorded. This is agreement between implementations; independent reference joint angles remain unavailable."],["Exploratory capture coverage","Heavy produced 134/135 usable frames in side-gym, 105/135 in side-mirror and 135/135 in side-busy-background. These clips explore tracking behavior and do not supply labeled angle-accuracy evidence. The explicit Full fallback also passed the supported timing labels."],["Source timeline and decoder matrix","Independent ffprobe checks account for 57/57 clear and 90/90 supported timestamps. Separate synthetic decoder QA ran through the explicit Full path: 30 Hz and rotated 30 Hz inputs retained 30/60 frames, 7 Hz retained 14/14, and a variable-rate input retained 21/21. Every reported timestamp matched a source frame. Three grayscale pixel comparisons per variant stayed below the 3/255 mean absolute RGB error limit. Rotation, malformed input and cancellation passed. This does not implement exact full-rate decoding."],["Local raw-pose export","The onPoseFrame API and built review export retain all 33 normalized xyz and 33 estimated world xyz slots with timestamp/model provenance. Missing probabilities remain null. Export stays local and is excluded from CoachPacket. The world coordinate origin is the model-estimated hip midpoint; these values are not calibrated motion-capture truth."],["JPEG and browser acceptance","Current Heavy packets use source JPEGs at 1,067/3,000 ms for clear-squat and 1,600/4,333 ms for supported-squat. Browser verification checks source pixels, source binding, the synchronized overlay, sample stepping and clipboard with no third-party requests. Final production browser QA is still pending."],["OpenCap importer verification","Nine constructed-data tests cover units, malformed rows, source/model/motion hashes, trimming/gaps, boundary rounding and playback lookup. A browser synthetic import check also passed. The actual host preflight reports unsupported-runtime. Native inference is deferred per the user. No real OpenCap inference, 3D angle accuracy or MediaPipe/OpenCap accuracy comparison has been performed."],["Historical Full provider evidence","The archived Full baseline preserves the old reports and JPEGs. That supported clip supplied the successful local ChatGPT request and earlier hosted harness run. The live response cited six approved measurement IDs and both image IDs. Do not substitute the current Heavy numbers into that historical result."],["Current root readiness and retained history","Production c1c9378 passed20 fresh-build readiness gates with Heavy,57/57 samples and0/67ms bottom errors. It also passed15 controlled-provider lifecycle and7 real-provider checks. These are scoped results; subsequent restyles need affected-gate reruns. No angle-accuracy or Wren qualification claim."],["Final hosted acceptance","Both historical harness-only Seldon cases passed on 2a6511f in experiment 9c9dabb7-9f02-4925-88e2-56eb9172b505. Harness debit was two, leaving a last-confirmed14. The merged frontend ledger records another run with debit pending; expected remaining13. The two final product cases still require one reachable integrated build, and all remaining simulations are held until it is complete."],["Live browser evidence","Heavy real-clip captureStream processed37 frames with72 busy drops, mean76.8ms/max164.6ms local processing latency and one stabilized rep callback with its exact JPEG. Two reps were reconstructed; the final event lacked later samples and was withheld. This is not phone-to-Mac latency. Two Chrome contexts also verified real WebRTC decoded pixels and Stop cleanup."],["Stacked cue browser checks","Smoke playback verification passed retained cards, no duplicate replay/seek events, source/model resets and no repeated inference using a controlled provider. Live local-camera verification retained two AI cards on Stop and cleared them on new Start. Current caps: 12 smoke cards and six live AI cards."],["Real root AI","qa/root-live-chatgpt.json records real GPT-6.1 Sol, one request, source images 1,067/3,000 ms, valid citations and cues for both reps without extra seek requests."],["Experimental multiview compatibility","Actual Heavy output had 57 frames and observed confidence for 1,881 points per coordinate representation. Left knee/hip estimates were available; occluded right joints and front-only proxies on this side view were withheld. This proves schema/abstention compatibility, not angle accuracy."],["Public HTTPS real coaching passed","Public phone page, real WebRTC, Heavy and real ChatGPT/local feedback return pass across two Chrome contexts with a fixture-backed camera. One request uses phas
